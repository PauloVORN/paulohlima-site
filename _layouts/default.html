<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF5EC">
  {% seo %}
  {% include jsonld.html %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Barlow:wght@300;400&family=Barlow+Condensed:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <noscript><style>.wa-fab{opacity:1;transform:none;pointer-events:auto}</style></noscript>
</head>
<body>
  {{ content }}
  {% include footer.html %}
  {% unless page.permalink == "/contato/" %}{% include whatsapp-fab.html %}{% endunless %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>

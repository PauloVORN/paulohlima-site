<!-- Masthead reutilizável. Passe mode="interior" nas páginas sem foto de
     fundo (tudo que não é a capa) para trocar pra fundo sólido + texto
     escuro, já que o estilo padrão (texto creme + sombra) só funciona
     sobre foto. -->
<nav class="masthead{% if include.mode == "interior" %} masthead--interior{% endif %}">
  <a class="masthead-name" href="{{ '/' | relative_url }}">Paulo H Lima</a>
  <div class="coverlines">
    <a href="{{ '/editorial/' | relative_url }}">Editorial</a>
    <a href="{{ '/campanha/' | relative_url }}">Campanha</a>
    <a href="{{ '/lookbook/' | relative_url }}">Lookbook</a>
    <a href="{{ '/fashion-film/' | relative_url }}">Fashion Film</a>
  </div>
</nav>
